
name: CI-CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: hetvigajjar/frontend:latest

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: hetvigajjar/backend:latest

      - name: Copy Docker Compose and Nginx Config to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx/default.conf"
          target: "/home/ubuntu/app"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD
          script: |
            set -eu

            cd /home/ubuntu/app

            echo "Checking Compose file received by EC2..."
            cat docker-compose.yml

            echo "Checking image names..."
            docker compose -f /home/ubuntu/app/docker-compose.yml config --images

            if grep -q 'YOUR_DOCKERHUB_USERNAME' docker-compose.yml; then
              echo "ERROR: Old placeholder found in Compose file!"
              exit 1
            fi

            echo "Logging into Docker Hub..."
            echo "$DOCKER_PASSWORD" | docker login \
              --username "$DOCKER_USERNAME" \
              --password-stdin

            echo "Pulling images..."
            docker compose -f /home/ubuntu/app/docker-compose.yml pull

            echo "Starting containers..."
            docker compose -f /home/ubuntu/app/docker-compose.yml up -d --remove-orphans

            echo "Checking container status..."
            docker compose -f /home/ubuntu/app/docker-compose.yml ps

            docker image prune -f

            echo "Deployment completed successfully!"
